# Ruff linter config. Run locally with:  ruff check .
# Conservative on purpose: catches likely bugs and dead code (pyflakes "F",
# syntax/statement errors "E4/E7/E9"), not formatting preferences.
target-version = "py311"

# Notebooks are exploratory; keep them out of the lint gate.
extend-exclude = ["notebooks"]

[lint]
select = ["E4", "E7", "E9", "F"]
