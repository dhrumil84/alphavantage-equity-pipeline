name: Lint

# Runs ruff (config in ruff.toml) on every PR and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ruff
      run: pip install ruff==0.6.9

    - name: Run ruff
      run: ruff check --output-format=github .
